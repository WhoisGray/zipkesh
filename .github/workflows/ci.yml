name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install 7-Zip (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y 7zip shellcheck
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install 7zip python@3.13
      - name: Check shell syntax
        run: bash -n install.sh uninstall.sh scripts/check-macos.sh
      - name: Check shell behavior
        if: runner.os == 'Linux'
        run: shellcheck --shell=bash install.sh uninstall.sh scripts/check-macos.sh
      - name: Unit and real encryption tests
        run: python3 -m unittest discover -s tests -v
      - name: Build, smoke-test and validate Finder service
        if: runner.os == 'macOS'
        run: bash scripts/check-macos.sh
      - name: Save verification evidence
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-check-${{ matrix.os }}
          path: work/macos-check.log

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check tag and package source
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          python3 scripts/package.py
      - name: Publish release after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/zipkesh-*.zip dist/SHA256SUMS \
            --verify-tag --title "Zipkesh $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
